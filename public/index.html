<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Smart Home Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-color: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent-glow: #818cf8;
            --accent-secondary: #2dd4bf;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 1rem;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.12), transparent 40%);
        }

        .dashboard-container {
            width: 90%;
            max-width: 800px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(129, 140, 248, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(129, 140, 248, 0.2);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #fff;
            transition: color 0.3s ease;
        }

        /* Value animations */
        .value-update {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            position: relative;
            z-index: 99;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15), 0 0 15px rgba(255, 255, 255, 0.2);
        }

        button:active {
            transform: scale(0.92) translateY(2px);
        }

        .temp-controls {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-active {
            background: linear-gradient(135deg, var(--accent-secondary), #0d9488);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
        }

        .btn-active:hover {
            background: linear-gradient(135deg, #0f766e, #0d9488);
            border-color: transparent;
        }

        .btn-danger-active {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-danger-active:hover {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            border-color: transparent;
        }

        .status-pill {
            position: absolute;
            top: 2rem;
            right: 3rem;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% {
                opacity: 0.5;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* Media Player Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 35px;
            margin-bottom: 1rem;
        }

        .bar {
            width: 8px;
            height: 5px;
            background: var(--accent-glow);
            border-radius: 4px;
            transition: height 0.2s ease, background 0.3s ease;
        }

        .playing .bar {
            animation: eq-bounce 0.8s infinite alternate ease-in-out;
            background: #a78bfa;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.6);
        }

        .playing .bar:nth-child(1) {
            animation-delay: 0.1s;
            animation-duration: 0.7s;
        }

        .playing .bar:nth-child(2) {
            animation-delay: 0.3s;
            animation-duration: 0.9s;
        }

        .playing .bar:nth-child(3) {
            animation-delay: 0.0s;
            animation-duration: 0.8s;
        }

        .playing .bar:nth-child(4) {
            animation-delay: 0.2s;
            animation-duration: 0.6s;
        }

        .playing .bar:nth-child(5) {
            animation-delay: 0.4s;
            animation-duration: 0.8s;
        }

        @keyframes eq-bounce {
            0% {
                height: 5px;
            }

            100% {
                height: 35px;
            }
        }

        /* Device Manager */
        .device-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .device-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .device-actions {
            display: flex;
            gap: 0.5rem;
        }

        .device-actions button {
            padding: 0.4rem 0.8rem;
            width: auto;
            font-size: 0.85rem;
        }

        .device-form {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            width: 100%;
        }

        .device-form input {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        .device-form input:focus {
            border-color: var(--accent-glow);
        }

        @media (max-width: 600px) {
            .dashboard-container {
                padding: 2rem 1.5rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .status-pill {
                top: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="status-pill">
            <div class="status-dot"></div> System Online
        </div>

        <div class="header">
            <h1>Nexus Smart Home</h1>
            <p>Interactive IoT Environment Control</p>
        </div>

        <div class="grid">
            <!-- Temperature Card -->
            <div class="card">
                <div class="card-icon">🌡️</div>
                <div class="card-title">Climate Control</div>
                <div class="card-value" id="tempVal">--°F</div>
                <div class="temp-controls">
                    <button onclick="changeTemp('decrease')">-</button>
                    <button onclick="changeTemp('increase')">+</button>
                </div>
            </div>

            <!-- Lights Card -->
            <div class="card">
                <div class="card-icon" id="lightIcon">💡</div>
                <div class="card-title">Living Room Lights</div>
                <div class="card-value" id="lightVal">--</div>
                <button id="lightBtn" onclick="toggleLights()">Toggle Lights</button>
            </div>

            <!-- Security Card -->
            <div class="card">
                <div class="card-icon" id="securityIcon">🛡️</div>
                <div class="card-title">Security System</div>
                <div class="card-value" id="securityVal">--</div>
                <button id="securityBtn" onclick="toggleSecurity()">Toggle Arm</button>
            </div>

            <!-- Media Player Card -->
            <div class="card">
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div class="card-title" id="trackName">Loading...</div>
                <div class="card-value" style="font-size: 1.2rem; margin-bottom: 1.5rem; color: var(--text-muted);"
                    id="mediaStatus">Stopped</div>
                <button id="mediaBtn" onclick="toggleMedia()">Play Music</button>
            </div>

            <!-- Energy Card -->
            <div class="card"
                style="grid-column: 1 / -1; display: flex; flex-direction: row; justify-content: space-between; padding: 1.5rem 2rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="card-icon" style="margin: 0; font-size: 2rem;">⚡</div>
                    <div style="text-align: left;">
                        <div class="card-title" style="margin: 0;">Total Energy Usage</div>
                    </div>
                </div>
                <div class="card-value" id="energyVal" style="margin: 0; color: #a5b4fc;">-- W</div>
            </div>

            <!-- CRUD: Device Manager -->
            <div class="card" style="grid-column: 1 / -1; align-items: flex-start; text-align: left;">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                    <div class="card-icon" style="margin: 0;">🔌</div>
                    <div class="card-title" style="margin: 0; font-size: 1.3rem; color: #fff;">Device Manager (CRUD)
                    </div>
                </div>

                <div class="device-list" id="deviceList">
                    <!-- Devices injected here -->
                </div>

                <div class="device-form">
                    <input type="text" id="newDeviceName" placeholder="Enter new device name (e.g. Smart Fan)">
                    <button style="width: auto;" onclick="addDevice()">Add Device</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Trigger visual update animation
        function animateValue(elementId, newValue) {
            const el = document.getElementById(elementId);
            if (el.innerText !== newValue) {
                el.innerText = newValue;
                el.classList.remove('value-update');
                void el.offsetWidth; // trigger reflow
                el.classList.add('value-update');
            }
        }

        // Fetch initial state
        async function fetchState() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                updateUI(data);
            } catch (error) {
                console.error("Failed to load state", error);
            }
        }

        // Update entire UI based on state object
        function updateUI(state) {
            animateValue('tempVal', `${state.temperature}°F`);

            // Lights
            const lightVal = document.getElementById('lightVal');
            const lightBtn = document.getElementById('lightBtn');
            const lightIcon = document.getElementById('lightIcon');

            if (state.lightsOn) {
                animateValue('lightVal', 'ON');
                lightVal.style.color = '#fbbf24';
                lightBtn.classList.add('btn-active');
                lightIcon.style.textShadow = '0 0 15px #fbbf24';
            } else {
                animateValue('lightVal', 'OFF');
                lightVal.style.color = '#fff';
                lightBtn.classList.remove('btn-active');
                lightIcon.style.textShadow = 'none';
            }

            // Security
            const secVal = document.getElementById('securityVal');
            const secBtn = document.getElementById('securityBtn');
            const secIcon = document.getElementById('securityIcon');

            if (state.securityArmed) {
                animateValue('securityVal', 'ARMED');
                secVal.style.color = '#ef4444';
                secBtn.classList.add('btn-danger-active');
                secBtn.innerText = 'Disarm System';
            } else {
                animateValue('securityVal', 'DISARMED');
                secVal.style.color = '#fff';
                secBtn.classList.remove('btn-danger-active');
                secBtn.innerText = 'Arm System';
            }

            // Energy
            animateValue('energyVal', `${state.energyUsage} W`);

            // Media
            updateMediaUI(state.media);
        }

        function updateMediaUI(mediaState) {
            document.getElementById('trackName').innerText = mediaState.track;
            const statusEl = document.getElementById('mediaStatus');
            const btn = document.getElementById('mediaBtn');
            const vis = document.getElementById('visualizer');

            if (mediaState.isPlaying) {
                statusEl.innerText = "Playing";
                statusEl.style.color = '#a78bfa';
                btn.innerText = "Pause Music";
                btn.classList.add('btn-active');
                vis.classList.add('playing');
            } else {
                statusEl.innerText = "Paused";
                statusEl.style.color = 'var(--text-muted)';
                btn.innerText = "Play Music";
                btn.classList.remove('btn-active');
                vis.classList.remove('playing');
            }
        }

        async function changeTemp(action) {
            try {
                const res = await fetch('/api/temperature', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                const data = await res.json();
                animateValue('tempVal', `${data.temperature}°F`);
            } catch (error) {
                console.error("Temp update failed", error);
            }
        }

        async function toggleLights() {
            try {
                const res = await fetch('/api/lights/toggle', { method: 'POST' });
                const data = await res.json();
                fetchState(); // Re-fetch to sync energy as well
            } catch (error) {
                console.error("Lights toggle failed", error);
            }
        }

        async function toggleSecurity() {
            try {
                const res = await fetch('/api/security/toggle', { method: 'POST' });
                const data = await res.json();
                fetchState();
            } catch (error) {
                console.error("Security toggle failed", error);
            }
        }

        async function toggleMedia() {
            try {
                const res = await fetch('/api/media/toggle', { method: 'POST' });
                const data = await res.json();
                updateMediaUI(data);
            } catch (error) {
                console.error("Media toggle failed", error);
            }
        }

        // --- CRUD Operations ---

        // READ
        async function fetchDevices() {
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();
                renderDevices(devices);
            } catch (error) {
                console.error("Failed to fetch devices", error);
            }
        }

        function renderDevices(devices) {
            const list = document.getElementById('deviceList');
            list.innerHTML = '';

            if (devices.length === 0) {
                list.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">No devices found. Add one below!</div>';
                return;
            }

            devices.forEach(device => {
                const isOnline = device.status === 'online';
                const statusColor = isOnline ? '#34d399' : '#ef4444';

                list.innerHTML += `
                    <div class="device-item">
                        <div class="device-info">
                            <div style="width: 10px; height: 10px; border-radius: 50%; background: ${statusColor};"></div>
                            <strong>${device.name}</strong>
                        </div>
                        <div class="device-actions">
                            <button style="background: rgba(255,255,255,0.05);" onclick="toggleDeviceStatus('${device.id}', '${isOnline ? 'offline' : 'online'}')">
                                Turn ${isOnline ? 'Off' : 'On'}
                            </button>
                            <button style="background: rgba(239, 68, 68, 0.2); color: #f87171;" onclick="deleteDevice('${device.id}')">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // CREATE
        async function addDevice() {
            const input = document.getElementById('newDeviceName');
            const name = input.value.trim();
            if (!name) return;

            try {
                await fetch('/api/devices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                input.value = '';
                fetchDevices();
            } catch (error) {
                console.error("Failed to add device", error);
            }
        }

        // UPDATE
        async function toggleDeviceStatus(id, newStatus) {
            try {
                await fetch(`/api/devices/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                fetchDevices();
            } catch (error) {
                console.error("Failed to update device", error);
            }
        }

        // DELETE
        async function deleteDevice(id) {
            try {
                await fetch(`/api/devices/${id}`, { method: 'DELETE' });
                fetchDevices();
            } catch (error) {
                console.error("Failed to delete device", error);
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchState();
            fetchDevices();
        });
    </script>
</body>

</html>
