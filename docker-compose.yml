# Docker Compose — Smart Home API + Prometheus Monitoring Stack
# Run with: docker-compose up -d
# Prometheus UI:  http://localhost:9090
# App:            http://localhost:3000
# App Metrics:    http://localhost:3000/metrics
# App Health:     http://localhost:3000/health
# Swagger Docs:   http://localhost:3000/api-docs

version: '3.8'

services:

  # ── Smart Home Node.js API ───────────────────────────────────────────────────
  devops-app:
    image: riyaverma/devops-app:latest
    container_name: devops-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - monitoring

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # Scrapes /metrics from devops-app every 15s
  # UI available at http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    depends_on:
      - devops-app

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  prometheus_data:

# ── Shared Network ────────────────────────────────────────────────────────────
networks:
  monitoring:
    driver: bridge
